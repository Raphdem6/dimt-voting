{% extends "voting/base.html" %}
{% block title %}Login problem - {{ site.site_name }}{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>Login problem</h1>
  <p class="hint">Send your ID number and the election officers will check it against the student list and fix the problem.</p>
  <form method="post" autocomplete="off">{% csrf_token %}
    <div class="hp" aria-hidden="true"><label for="website">Leave this empty</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
    <label for="student_id">Your ID number</label>
    <input id="student_id" name="student_id" type="text" value="{{ prefill_id }}" maxlength="40" autocapitalize="characters" required>
    <label for="full_name">Your full name <span class="hint">(optional)</span></label>
    <input id="full_name" name="full_name" type="text" maxlength="150" autocomplete="name">
    <label for="problem">What happened?</label>
    <select id="problem" name="problem">{% for key, label in problems %}<option value="{{ key }}">{{ label }}</option>{% endfor %}</select>
    <label for="message">More details <span class="hint">(optional)</span></label>
    <textarea id="message" name="message" rows="3" maxlength="600"></textarea>
    <label for="phone">Phone number to reach you <span class="hint">(optional)</span></label>
    <input id="phone" name="phone" type="text" inputmode="tel" maxlength="30" autocomplete="tel">
    <button class="btn block">Send to election officers</button>
  </form>
</div>
{% endblock %}
