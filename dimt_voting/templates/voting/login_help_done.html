{% extends "voting/base.html" %}
{% block content %}
<div class="panel notice narrow">
  <h1>Your ID has been sent</h1>
  <p>The election officers will check it. Keep this reference number:</p>
  <p><span class="receipt-code">{{ reference }}</span></p>
  <p class="hint">Try logging in again after a while. If you are still stuck, see an election officer in person.</p>
  <div class="actions center"><a class="btn" href="{% url 'login' %}">Back to login</a></div>
</div>
{% endblock %}
